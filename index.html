<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- prefetch for crawler connection -->
    <link rel="dns-prefetch" href="https://allen0099.github.io" />
    <link rel="preconnect" href="https://allen0099.github.io" crossorigin />

    <title>北市大選課小幫手</title>

    <!-- Default meta tags (will be replaced by build script for static OG support) -->
    <meta name="description" content="臺北市立大學課程查詢與課表工具，可查開課資料、排課表、偵測衝堂，並提供行事曆、校園地圖與節次表。" />
    <meta name="author" content="北市大選課小幫手" />

    <!-- Open Graph meta tags -->
    <meta property="og:title" content="北市大選課小幫手" />
    <meta property="og:description"
          content="臺北市立大學課程查詢與課表工具，可查開課資料、排課表、偵測衝堂，並提供行事曆、校園地圖與節次表。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://utc.allen0099.tw/" />
    <meta property="og:site_name" content="北市大選課小幫手" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:image" content="https://utc.allen0099.tw/CatMeow.png" />
    <meta property="og:image:alt" content="北市大選課小幫手的貓咪吉祥物" />

    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="北市大選課小幫手" />
    <meta name="twitter:description"
          content="臺北市立大學課程查詢與課表工具，可查開課資料、排課表、偵測衝堂，並提供行事曆、校園地圖與節次表。" />
    <meta name="twitter:image" content="https://utc.allen0099.tw/CatMeow.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://utc.allen0099.tw/" />

    <!-- Apply saved theme before first paint to avoid flash of wrong theme -->
    <script>
      (function () {
        var theme = localStorage.getItem("theme");

        if (
          theme === "dark" ||
          (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
